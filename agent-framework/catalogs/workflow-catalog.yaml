workflows:
  - id: software-lifecycle
    title: Software Lifecycle Workflow
    summary: Mode-aware lifecycle with bounded discovery, design, execution, marketing and measurement routes; evidence
      gates apply only to the requested outcome.
    roles:
      - orchestrator
      - product-manager
      - market-opportunity-researcher
      - deep-researcher
      - software-architect
      - integration-architect
      - data-database-engineer
      - ui-ux-designer
      - implementation-engineer
      - code-reviewer
      - qa-test-engineer
      - security-privacy-reviewer
      - accessibility-reviewer
      - performance-reliability-engineer
      - technical-writer
      - devops-release-engineer
      - end-user-simulator
      - rubber-duck
      - skeptical-reviewer
      - product-marketing-strategist
      - growth-analyst
    entry_point: agent-framework/canonical/workflows/software-lifecycle/WORKFLOW.md
  - id: deep-research
    title: Deep Research Workflow
    summary: Technical research via question refinement, primary-source sweep, adversarial verification, and labeled
      synthesis; read-only, report output only.
    roles:
      - orchestrator
      - deep-researcher
      - skeptical-reviewer
    entry_point: agent-framework/canonical/workflows/deep-research/WORKFLOW.md
  - id: market-research
    title: Market Research Workflow
    summary: Profile-aware consumer, business or developer-tool market evidence; optional applicable scoring, advice
      returned without tracked writes.
    roles:
      - orchestrator
      - market-opportunity-researcher
      - skeptical-reviewer
      - product-manager
    entry_point: agent-framework/canonical/workflows/market-research/WORKFLOW.md
  - id: persona-validation
    title: Persona Validation Workflow
    summary: Read-only AI-persona simulations generating hypotheses and proposed Candidates, never empirical interviews
      or demand evidence.
    roles:
      - orchestrator
      - end-user-simulator
      - product-manager
    entry_point: agent-framework/canonical/workflows/persona-validation/WORKFLOW.md
