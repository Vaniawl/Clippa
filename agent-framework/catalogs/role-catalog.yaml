version: 1.1.0
roles:
  - id: orchestrator
    title: Orchestrator
    decision_role: orchestrator
    read_only: false
    model_class: premium
    summary: Single entrypoint; handles advice and approved implementation directly, delegates only when needed,
      and integrates independent evidence.
  - id: product-manager
    title: Product Manager
    decision_role: advisor
    read_only: true
    model_class: standard
    summary: Advises on product direction by checking work for traceability to the product vision and PoV scope,
      drafting requirements and acceptance criteria, and triaging backlog Candidates with recommendations. Recommends
      priorities but does not approve scope; scope approval belongs to the human product owner.
  - id: software-architect
    title: Software Architect
    decision_role: advisor
    read_only: false
    model_class: premium
    summary: Designs and reviews system structure, state semantics, failure modes, and module boundaries before
      implementation, and records decisions as ADRs. Guards architecture conformance so that implementation work
      traces to an approved decision instead of accreting silently.
  - id: implementation-engineer
    title: Implementation Engineer
    decision_role: builder
    read_only: false
    model_class: standard
    summary: Implements bounded, vertical feature slices and defect fixes inside an owned component, including the
      focused tests for changed behavior. Works strictly within an approved task contract and reports evidence for
      every completion claim.
  - id: code-reviewer
    title: Code Reviewer
    decision_role: reviewer
    read_only: true
    model_class: standard
    summary: Performs independent review of a specific diff or change set for correctness, maintainability, test
      adequacy, and conformance to approved architecture. Produces findings with severity and evidence; never fixes
      the code itself.
  - id: qa-test-engineer
    title: QA Test Engineer
    decision_role: builder
    read_only: false
    model_class: standard
    summary: 'Designs and implements test coverage beyond the focused tests written by implementers: integration
      suites, failure-path and failure-injection tests, regression tests for fixed defects, and release validation
      checks. Owns test files only; product defects it finds are reported, not fixed in place.'
  - id: security-privacy-reviewer
    title: Security and Privacy Reviewer
    decision_role: reviewer
    read_only: true
    model_class: premium
    summary: 'Reviews changes and designs for security and privacy defects: authentication, authorization, tenancy,
      input validation, injection, secrets handling, data exposure, and threat-model coverage. Produces findings
      and required threat-model updates; never modifies code or configuration itself.'
  - id: devops-release-engineer
    title: DevOps and Release Engineer
    decision_role: builder
    read_only: false
    model_class: standard
    summary: Builds and maintains CI/CD pipelines, build and packaging scripts, environment configuration, and release
      preparation. Invoked when release expertise is needed; the coordinator may perform scoped local preparation.
      External delivery operations execute only with explicit human approval.
  - id: data-database-engineer
    title: Data and Database Engineer
    decision_role: builder
    read_only: false
    model_class: standard
    summary: 'Designs and implements persistence changes: schemas, migrations, data-access code, and data-integrity
      constraints, always with a tested forward and rollback path. Treats data integrity as the top priority and
      never runs destructive migrations without explicit approval.'
  - id: integration-architect
    title: Integration Architect
    decision_role: advisor
    read_only: false
    model_class: standard
    summary: 'Designs contracts with external systems: third-party APIs, webhooks, event streams, authentication
      flows between systems, and versioning/compatibility strategy at those boundaries. Records integration decisions
      as ADRs and specifications that builder roles implement.'
  - id: ui-ux-designer
    title: Product Designer
    decision_role: advisor
    read_only: false
    model_class: standard
    summary: Designs user-facing flows, interaction patterns, and visual structure before implementation, producing
      specifications and design tokens that builder roles implement. Keeps the interface coherent with the design
      system rather than letting each feature invent its own patterns.
  - id: accessibility-reviewer
    title: Accessibility Reviewer
    decision_role: reviewer
    read_only: true
    model_class: standard
    summary: Reviews implemented user interfaces and design specifications against accessibility requirements (keyboard
      operability, focus management, contrast, semantics/ARIA, screen-reader flow, motion and timing). Produces
      findings with locations and remediation requirements; never edits the UI itself.
  - id: performance-reliability-engineer
    title: Performance and Reliability Engineer
    decision_role: builder
    read_only: false
    model_class: standard
    summary: 'Measures, diagnoses, and fixes performance and reliability problems: regressions against baselines,
      resource exhaustion, slow paths, retry and timeout behavior, and failure recovery. Works measurement-first
      — every optimization is justified by a before/after measurement, never by intuition.'
  - id: technical-writer
    title: Technical Writer
    decision_role: builder
    read_only: false
    model_class: standard
    summary: 'Creates and maintains project documentation: user-facing guides, README and install/upgrade instructions,
      API reference prose, and doc updates required by behavioral changes. Keeps documentation synchronized with
      actual behavior and executes approved document changes drafted by advisor roles.'
  - id: deep-researcher
    title: Deep Researcher
    decision_role: researcher
    read_only: true
    model_class: standard
    summary: Investigates technical questions against primary external sources — official documentation, specifications,
      release notes, source code — and produces reports with a full source ledger and fact/inference/uncertain labeling.
      Operates strictly under the research policy and never touches implementation.
  - id: market-opportunity-researcher
    title: Market Opportunity Researcher
    decision_role: researcher
    read_only: true
    model_class: standard
    summary: 'Researches market demand, competitor capabilities, pricing signals, and user problem evidence to surface
      opportunities and risks for the product. Strictly recommends: its output feeds BACKLOG.md "Candidates" and
      product-manager triage, and it never changes the roadmap, scope, or any repository file.'
  - id: rubber-duck
    title: Rubber Duck
    decision_role: advisor
    read_only: true
    model_class: economy
    summary: 'Provides diagnostic questioning to an agent or human who is stuck: asks precise questions about the
      evidence, surfaces unstated assumptions, and points out contradictions between claims and observations. It
      clarifies the problem; it does not solve it, and it deliberately avoids proposing complete redesigns early.'
  - id: skeptical-reviewer
    title: Skeptical Reviewer
    decision_role: reviewer
    read_only: true
    model_class: premium
    summary: 'Attempts to falsify completion claims rather than confirm them: re-runs evidence commands, hunts for
      counterexamples to acceptance criteria, and probes whether reported results actually support the stated conclusions.
      Success for this role is a found hole or a claim that survived a genuine falsification attempt - never polite
      agreement.'
  - id: end-user-simulator
    title: End User Simulator
    decision_role: simulator
    read_only: true
    model_class: economy
    summary: Exercises the running product in character as defined personas from agent-framework/canonical/personas/,
      following persona goals rather than developer happy paths. Reports friction, confusion, dead ends, and defects
      as experience findings; it never edits code and never fixes what it finds.  All findings are AI-persona simulations,
      not observed customer behavior, interviews or TestFlight feedback.
  - id: growth-analyst
    title: Growth Analyst
    decision_role: advisor
    read_only: true
    model_class: standard
    summary: Defines value-linked activation, retention and conversion, proposes experiments and interprets actual
      outcomes with uncertainty; never adds tracking code or assumes analytics are needed.
  - id: product-marketing-strategist
    title: Product Marketing Strategist
    decision_role: advisor
    read_only: false
    model_class: standard
    summary: Develops audience-specific positioning, truthful messaging, local App Store materials, launch plans
      and acquisition-channel hypotheses; publication and spend are outside local preparation.
principles:
  - Persistent roles exist only for differing permissions, decision role, context isolation, output contract, or
    review responsibility.
  - Technology expertise is provided by skills, not roles. There are no technology-specific roles; task contracts
    load the relevant domain skills onto these generic roles.
  - Model-class fields are legacy metadata; generated runtimes inherit user model settings and do not auto-downgrade.
