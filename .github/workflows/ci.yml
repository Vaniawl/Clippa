name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: macos-26
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show toolchain
        run: xcodebuild -version

      - name: Run tests
        run: |
          xcodebuild \
            -project Clippa.xcodeproj \
            -scheme Clippa \
            -destination 'platform=macOS' \
            test

      - name: Check extracted localization coverage
        run: ./scripts/check-localization-usage.sh

  release:
    name: Release Build Validation
    needs: test
    runs-on: macos-26
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate release script
        run: bash -n ./scripts/release.sh

      - name: Build unsigned Release configuration
        run: |
          xcodebuild \
            -project Clippa.xcodeproj \
            -scheme Clippa \
            -configuration Release \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

  ios:
    name: iOS Companion Build
    runs-on: macos-26
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show toolchain
        run: xcodebuild -version

      - name: Test iPhone companion
        run: |
          IOS_DESTINATION="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print "platform=iOS Simulator,id="$2; exit}')"
          if [ -z "$IOS_DESTINATION" ]; then
            echo "No available iPhone simulator found"
            exit 1
          fi
          xcodebuild \
            -project Clippa.xcodeproj \
            -scheme 'Clippa iOS' \
            -destination "$IOS_DESTINATION" \
            CODE_SIGNING_ALLOWED=NO \
            test
